<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>·</title>
  <meta name="robots" content="noindex, nofollow, noarchive">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#000;
      --green:#00ff7f;
      --cyan:#00e5ff;
      --magenta:#ff2bd6;
      --muted:#3f6656;
      --btc:#f7931a;
      --xmr:#ff6600;
      --red:#ff3355;
      --font:'Share Tech Mono','IBM Plex Mono',monospace;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%}
    body{
      font-family:var(--font);
      background:var(--bg);
      color:#a9c9bb;
      overflow-x:hidden;
      min-height:100vh;
    }
    ::selection{background:var(--green);color:#000}
    canvas#matrix{position:fixed;inset:0;z-index:0;opacity:.14}
    .crt{
      position:fixed;inset:0;pointer-events:none;z-index:100;
      background:
        radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.8) 100%),
        repeating-linear-gradient(0deg,transparent 0,transparent 2px,rgba(0,0,0,.32) 2px,rgba(0,0,0,.32) 4px);
    }
    .noise{
      position:fixed;inset:0;pointer-events:none;z-index:99;opacity:.05;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }
    @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

    .wrap{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:2.2rem 1.2rem 4rem}

    .topbar{
      display:flex;justify-content:space-between;align-items:center;
      font-size:10px;letter-spacing:.16em;color:var(--muted);margin-bottom:1.8rem;
    }
    .topbar a{color:var(--muted);text-decoration:none}
    .topbar a:hover{color:var(--cyan)}
    .online{color:var(--green);text-shadow:0 0 8px var(--green)}
    .online::before{content:"● ";animation:blink 1.4s infinite}

    .banner{
      font-size:clamp(1.3rem,5.5vw,1.9rem);letter-spacing:.08em;color:#eafff2;
      text-transform:uppercase;font-weight:700;position:relative;display:inline-block;
      margin-bottom:.3rem;
    }
    .banner::before,.banner::after{
      content:attr(data-text);position:absolute;left:0;top:0;width:100%;overflow:hidden;pointer-events:none;
    }
    .banner::before{color:var(--cyan);clip-path:inset(0 0 55% 0);transform:translate(-2px,0);opacity:.9;animation:glA 2.6s infinite linear alternate-reverse;text-shadow:-2px 0 var(--cyan)}
    .banner::after{color:var(--magenta);clip-path:inset(50% 0 0 0);transform:translate(2px,0);opacity:.85;animation:glB 2.1s infinite linear alternate-reverse;text-shadow:2px 0 var(--magenta)}
    @keyframes glA{0%,86%,100%{transform:translate(0)}88%{transform:translate(-3px,1px)}92%{transform:translate(2px,-1px)}96%{transform:translate(-1px,0)}}
    @keyframes glB{0%,82%,100%{transform:translate(0)}84%{transform:translate(3px,-1px)}89%{transform:translate(-2px,1px)}94%{transform:translate(1px,0)}}
    .banner-sub{font-size:10.5px;letter-spacing:.14em;color:var(--muted);margin-bottom:2rem}

    #term{
      font-size:13px;line-height:1.85;white-space:pre-wrap;word-break:break-word;
      text-shadow:0 0 4px rgba(0,255,127,.15);
    }
    .p{color:var(--muted)}
    .c{color:var(--green)}
    .c2{color:var(--cyan)}
    .out{color:#c7e6d8;display:block;padding-left:1.1em}
    .dim{color:var(--muted)}
    .up{color:var(--green)}
    .down{color:var(--red)}
    .btc-c{color:var(--btc)}
    .xmr-c{color:var(--xmr)}
    #term a{color:var(--cyan);text-decoration:underline}
    #term .cur{display:inline-block;width:7px;height:1em;background:var(--green);margin-left:1px;vertical-align:-2px;animation:blink 1s steps(1) infinite}

    .skip-hint{position:fixed;bottom:1rem;left:0;right:0;text-align:center;font-size:9px;letter-spacing:.2em;color:var(--muted);z-index:5}

    @media (prefers-reduced-motion:reduce){
      *{animation-duration:.001s !important;animation-iteration-count:1 !important}
      canvas#matrix{display:none}
    }
  </style>
</head>
<body>
  <canvas id="matrix"></canvas>
  <div class="noise"></div>
  <div class="crt"></div>

  <div class="wrap">
    <div class="topbar">
      <a href="index.html">← disconnect</a>
      <div class="online">CHANNEL OPEN</div>
    </div>

    <div class="banner" data-text="stark // ops">stark // ops</div>
    <div class="banner-sub">build 0x07 · acceso por invitación</div>

    <pre id="term"></pre>
    <div class="skip-hint" id="skip-hint">pulsa cualquier tecla para omitir</div>
  </div>

  <script>
    // matrix rain
    (function(){
      const cv=document.getElementById('matrix');
      const ctx=cv.getContext('2d');
      let w,h,cols,drops;
      const glyphs='アイウエオカキクケコサシスセソ0123456789ABCDEF$#%&';
      function setup(){
        w=cv.width=innerWidth; h=cv.height=innerHeight;
        cols=Math.floor(w/16);
        drops=Array(cols).fill(0).map(()=>Math.random()*-40);
      }
      setup();
      window.addEventListener('resize',setup);
      const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if(!reduce){
        setInterval(()=>{
          ctx.fillStyle='rgba(0,0,0,.09)';
          ctx.fillRect(0,0,w,h);
          ctx.fillStyle='#00ff7f';
          ctx.font='14px monospace';
          drops.forEach((y,i)=>{
            const ch=glyphs[Math.floor(Math.random()*glyphs.length)];
            ctx.fillText(ch,i*16,y*16);
            if(y*16>h && Math.random()>.975) drops[i]=0;
            drops[i]++;
          });
        },45);
      }
    })();

    // live BTC/XMR (fetched once, spliced into the transcript before it prints)
    function spark(pts){
      const chars='▁▂▃▄▅▆▇█';
      return pts.map(p=>chars[Math.min(7,Math.floor(p*8))]).join('');
    }
    const sid = '0x'+Math.random().toString(16).slice(2,10).toUpperCase();

    async function getPrices(){
      const fallback = {
        btc:{price:'…',chg:0,pts:[0.38,0.44,0.41,0.49,0.47,0.54,0.51,0.57,0.59,0.56,0.62,0.65]},
        xmr:{price:'…',chg:0,pts:[0.48,0.45,0.51,0.47,0.43,0.49,0.46,0.53,0.5,0.56,0.54,0.59]}
      };
      try{
        const r=await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,monero&vs_currencies=usd&include_24hr_change=true');
        const d=await r.json();
        if(d.bitcoin) fallback.btc={price:'$'+Math.round(d.bitcoin.usd).toLocaleString(),chg:d.bitcoin.usd_24h_change||0,pts:fallback.btc.pts};
        if(d.monero) fallback.xmr={price:'$'+d.monero.usd.toFixed(1),chg:d.monero.usd_24h_change||0,pts:fallback.xmr.pts};
      }catch(e){}
      return fallback;
    }

    function fmtChg(c){
      const sign=c>=0?'+':'';
      const cls=c>=0?'up':'down';
      return '<span class="'+cls+'">'+sign+c.toFixed(1)+'%</span>';
    }

    (async function boot(){
      const prices = await getPrices();
      const term = document.getElementById('term');
      const skipHint = document.getElementById('skip-hint');
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      const script = [
        {p:'guest@stark',c:'~$ ',cmd:'ssh node --identity=0x0732E79E'},
        {out:'negociando handshake sobre Tor ... <span class="up">OK</span>'},
        {out:'montando canal cifrado ... <span class="up">OK</span>'},
        {out:'sesión <b>'+sid+'</b> · acceso: <span class="up">GRANTED</span>'},
        {blank:true},
        {p:'guest@stark',c:'~$ ', cmd:'cat manifiesto.txt'},
        {out:'Sin paquetes. Sin intermediarios. Sin registros.'},
        {out:'Esto no es una tienda, es un canal.'},
        {out:'Si el alcance está claro, se ejecuta. Si no, no hay conversación.'},
        {blank:true},
        {p:'guest@stark',c:'~$ ', cmd:'cat modulos.list'},
        {out:'[0x01] THREAT_MODEL    <span class="dim">superficie de ataque · quién y por dónde</span>'},
        {out:'[0x02] HARDENING       <span class="dim">sistemas · hábitos · setup real</span>'},
        {out:'[0x03] SECURE_COMMS    <span class="dim">canales resistentes a vigilancia</span>'},
        {out:'[0x04] OPSEC_REVIEW    <span class="dim">fugas actuales · cómo cortarlas</span>'},
        {out:'[0x05] IDENTITY        <span class="dim">huella pública · separación de contextos</span>'},
        {out:'[0x06] CUSTOM          <span class="dim">lo que haga falta · se define en privado</span>'},
        {blank:true},
        {p:'guest@stark',c:'~$ ', cmd:'./engage.sh --flow'},
        {out:'[01] contacto <span class="dim">&gt;&gt;</span> [02] alcance <span class="dim">&gt;&gt;</span> [03] anticipo <span class="dim">&gt;&gt;</span> [04] ejecución'},
        {blank:true},
        {p:'guest@stark',c:'~$ ', cmd:'watch payment_channels.sh'},
        {out:'BTC  <span class="btc-c">'+prices.btc.price+'</span>  '+spark(prices.btc.pts)+'  '+fmtChg(prices.btc.chg)},
        {out:'XMR  <span class="xmr-c">'+prices.xmr.price+'</span>  '+spark(prices.xmr.pts)+'  '+fmtChg(prices.xmr.chg)},
        {blank:true},
        {out:'<span class="dim">NOINDEX · NO LOGS · NO TRACE</span>'}
      ];

      function renderInstant(){
        let html='';
        script.forEach(l=>{
          if(l.blank){ html+='\n'; return; }
          if(l.cmd!==undefined){ html+='<span class="p">'+l.p+'</span><span class="c2">'+l.c+'</span><span class="c">'+l.cmd+'</span>\n'; }
          else { html+='<span class="out">'+l.out+'</span>\n'; }
        });
        html+='<span class="cur"></span>';
        term.innerHTML=html;
        skipHint.style.display='none';
      }

      if(reduce){ renderInstant(); return; }

      let i=0;
      let done=false;
      function finish(){
        if(done) return;
        done=true;
        renderInstant();
      }
      window.addEventListener('keydown',finish,{once:true});
      document.addEventListener('click',finish,{once:true});

      async function typeLine(li){
        const l=script[li];
        if(l.blank){ term.innerHTML+='\n'; return; }
        if(l.cmd!==undefined){
          term.innerHTML+='<span class="p">'+l.p+'</span><span class="c2">'+l.c+'</span><span class="c" id="typing"></span><span class="cur"></span>';
          const target=document.getElementById('typing');
          for(let ch=0; ch<=l.cmd.length; ch++){
            if(done) return;
            target.textContent=l.cmd.slice(0,ch);
            await new Promise(r=>setTimeout(r,16+Math.random()*20));
          }
          document.querySelector('#term .cur')?.remove();
          term.innerHTML+='\n';
        } else {
          term.innerHTML+='<span class="out">'+l.out+'</span>\n';
          await new Promise(r=>setTimeout(r,90));
        }
      }

      for(i=0; i<script.length; i++){
        if(done){ renderInstant(); break; }
        await typeLine(i);
      }
      if(!done){
        term.innerHTML+='<span class="cur"></span>';
        skipHint.style.display='none';
      }
    })();
  </script>
</body>
</html>
