<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>·</title>
  <meta name="robots" content="noindex, nofollow, noarchive">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --cyan: #00f0ff;
      --blue: #4f7cff;
      --green: #00ff9c;
      --btc: #f7931a;
      --xmr: #ff6600;
      --muted: #2a3140;
      --font: 'IBM Plex Mono', ui-monospace, monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: var(--font);
      background: #000;
      color: #c8d0dc;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .noise {
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.09'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 50;
    }
    .scan {
      position: fixed; inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent 0px,
        transparent 2px,
        rgba(0,0,0,0.35) 2px,
        rgba(0,0,0,0.35) 4px
      );
      pointer-events: none; z-index: 51;
      opacity: 0.65;
    }
    .vignette {
      position: fixed; inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.7) 100%);
      pointer-events: none; z-index: 49;
    }
    .bar {
      position: relative; z-index: 10;
      display: flex; justify-content: space-between; align-items: center;
      padding: 1rem 1.4rem;
      font-size: 10px; letter-spacing: 0.16em;
      color: var(--muted);
    }
    .bar a {
      color: var(--muted); text-decoration: none;
      transition: color 0.2s, text-shadow 0.2s;
    }
    .bar a:hover { color: var(--cyan); text-shadow: 0 0 10px var(--cyan); }
    .live {
      display: flex; align-items: center; gap: 0.4rem;
      color: var(--green);
    }
    .live i {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 10px var(--green);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.15; }
    }
    .prices {
      position: relative; z-index: 10;
      display: grid; grid-template-columns: 1fr 1fr;
      border-top: 1px solid #111820;
      border-bottom: 1px solid #111820;
      background: #05070a;
    }
    @media (max-width: 480px) { .prices { grid-template-columns: 1fr; } }
    .p {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.75rem 1.2rem; gap: 0.8rem;
    }
    .p + .p { border-left: 1px solid #111820; }
    @media (max-width: 480px) { .p + .p { border-left: none; border-top: 1px solid #111820; } }
    .p.btc { border-top: 2px solid var(--btc); }
    .p.xmr { border-top: 2px solid var(--xmr); }
    .p-label {
      font-size: 9px; letter-spacing: 0.14em;
      color: #3a4455; text-transform: uppercase; margin-bottom: 0.1rem;
    }
    .p-val { font-size: 1.15rem; font-weight: 600; }
    .p-val.btc { color: var(--btc); text-shadow: 0 0 16px rgba(247,147,26,0.35); }
    .p-val.xmr { color: var(--xmr); text-shadow: 0 0 16px rgba(255,102,0,0.35); }
    .p-chg { font-size: 10px; margin-left: 0.3rem; }
    .up { color: var(--green); }
    .down { color: #ff3355; }
    .p canvas { width: 72px; height: 24px; display: block; }
    .stage {
      flex: 1;
      position: relative; z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem 1.5rem;
    }
    .sig {
      font-size: 10px;
      letter-spacing: 0.28em;
      color: #2a3344;
      margin-bottom: 2rem;
      animation: flicker 6s infinite;
    }
    @keyframes flicker {
      0%, 91%, 100% { opacity: 1; }
      92% { opacity: 0.2; }
      93% { opacity: 1; }
      95% { opacity: 0.4; }
      96% { opacity: 1; }
    }
    .title {
      font-size: clamp(1.8rem, 7vw, 2.8rem);
      font-weight: 500;
      letter-spacing: 0.12em;
      color: #eef2f8;
      position: relative;
      display: inline-block;
      margin-bottom: 1.8rem;
    }
    .title::before,
    .title::after {
      content: attr(data-text);
      position: absolute;
      left: 0; top: 0;
      width: 100%;
      overflow: hidden;
      pointer-events: none;
    }
    .title::before {
      color: var(--cyan);
      clip-path: inset(0 0 45% 0);
      transform: translate(-3px, 0);
      opacity: 0.95;
      animation: gA 2.1s infinite linear alternate-reverse;
      text-shadow: -3px 0 var(--cyan), 0 0 24px rgba(0,240,255,0.5);
    }
    .title::after {
      color: var(--blue);
      clip-path: inset(55% 0 0 0);
      transform: translate(3px, 0);
      opacity: 0.9;
      animation: gB 1.7s infinite linear alternate-reverse;
      text-shadow: 3px 0 var(--blue), 0 0 20px rgba(79,124,255,0.4);
    }
    @keyframes gA {
      0%, 82%, 100% { transform: translate(0); }
      84% { transform: translate(-4px, 1.5px); }
      88% { transform: translate(3px, -1px); }
      92% { transform: translate(-2px, 0.5px); }
      96% { transform: translate(1.5px, -0.5px); }
    }
    @keyframes gB {
      0%, 78%, 100% { transform: translate(0); }
      80% { transform: translate(4px, -1.5px); }
      85% { transform: translate(-3px, 1px); }
      90% { transform: translate(2px, -0.5px); }
      95% { transform: translate(-1.5px, 0.5px); }
    }
    .slash {
      width: 1px;
      height: 28px;
      background: linear-gradient(180deg, transparent, var(--cyan), transparent);
      margin: 0 auto 1.8rem;
      box-shadow: 0 0 12px var(--cyan);
      opacity: 0.7;
    }
    .one {
      font-size: 12px;
      letter-spacing: 0.18em;
      color: #4a5568;
      line-height: 2;
    }
    .one b {
      color: #9aa8bc;
      font-weight: 500;
    }
    .bottom {
      position: relative; z-index: 10;
      padding: 1.2rem;
      font-size: 9px;
      letter-spacing: 0.2em;
      color: #1a2030;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="noise"></div>
  <div class="scan"></div>
  <div class="vignette"></div>

  <div class="bar">
    <a href="index.html">←</a>
    <div class="live"><i></i>live</div>
  </div>

  <div class="prices">
    <div class="p btc">
      <div>
        <div class="p-label">Bitcoin</div>
        <div>
          <span class="p-val btc" id="btc">—</span>
          <span class="p-chg" id="btc-c"></span>
        </div>
      </div>
      <canvas id="c-btc" width="72" height="24"></canvas>
    </div>
    <div class="p xmr">
      <div>
        <div class="p-label">Monero</div>
        <div>
          <span class="p-val xmr" id="xmr">—</span>
          <span class="p-chg" id="xmr-c"></span>
        </div>
      </div>
      <canvas id="c-xmr" width="72" height="24"></canvas>
    </div>
  </div>

  <div class="stage">
    <div class="sig">canal privado</div>

    <div class="title" data-text="contrata">contrata</div>

    <div class="slash"></div>

    <div class="one">
      <b>1:1</b> · alcance cerrado · <b>BTC / XMR</b>
    </div>
  </div>

  <div class="bottom">noindex</div>

  <script>
    async function prices() {
      try {
        const r = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,monero&vs_currencies=usd&include_24hr_change=true');
        const d = await r.json();
        const b = d.bitcoin, x = d.monero;
        if (b) {
          document.getElementById('btc').textContent = '$' + Math.round(b.usd).toLocaleString();
          const c = b.usd_24h_change || 0;
          const el = document.getElementById('btc-c');
          el.textContent = (c >= 0 ? '+' : '') + c.toFixed(1) + '%';
          el.className = 'p-chg ' + (c >= 0 ? 'up' : 'down');
        }
        if (x) {
          document.getElementById('xmr').textContent = '$' + x.usd.toFixed(1);
          const c = x.usd_24h_change || 0;
          const el = document.getElementById('xmr-c');
          el.textContent = (c >= 0 ? '+' : '') + c.toFixed(1) + '%';
          el.className = 'p-chg ' + (c >= 0 ? 'up' : 'down');
        }
      } catch (e) {}
    }
    prices();
    function draw(id, pts, col) {
      const cv = document.getElementById(id);
      if (!cv) return;
      const ctx = cv.getContext('2d');
      const W = cv.width, H = cv.height;
      ctx.clearRect(0, 0, W, H);
      ctx.beginPath();
      pts.forEach((p, i) => {
        const x = (i / (pts.length - 1)) * (W - 2) + 1;
        const y = H - 2 - p * (H - 4);
        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      });
      ctx.strokeStyle = col;
      ctx.lineWidth = 1.3;
      ctx.stroke();
    }
    draw('c-btc', [0.38,0.44,0.41,0.49,0.47,0.54,0.51,0.57,0.59,0.56,0.62,0.65], '#f7931a');
    draw('c-xmr', [0.48,0.45,0.51,0.47,0.43,0.49,0.46,0.53,0.5,0.56,0.54,0.59], '#ff6600');
  </script>
</body>
</html>
