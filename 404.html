<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página no encontrada — Stark Privacy</title>
  <meta name="robots" content="noindex">
  <meta name="description" content="Esta ruta no existe en Stark Privacy.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #080b10;
      --elev: #0e131a;
      --card: #121820;
      --border: #1c2530;
      --text: #e8edf4;
      --muted: #8b9bb0;
      --accent: #3b82f6;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: "";
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
    }
    a { color: inherit; text-decoration: none; }
    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }
    .wrap { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }
    nav {
      border-bottom: 1px solid var(--border);
      background: rgba(8,11,16,.92);
      backdrop-filter: blur(16px);
    }
    .nav-inner {
      width: min(1080px, 92%);
      margin: 0 auto;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo { font-weight: 600; font-size: 1.05rem; display: flex; align-items: center; gap: .35rem; }
    .logo span { color: var(--accent); font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: .82rem; font-weight: 500; }
    .nav-cta {
      font-size: .84rem; font-weight: 550;
      background: var(--accent); color: #fff;
      padding: .4rem .95rem; border-radius: 999px;
    }
    .nav-cta:hover { background: #2563eb; }
    main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 4.5rem 0 3.5rem;
    }
    .card {
      width: min(560px, 92%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem 2rem 1.7rem;
    }
    .label {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: .72rem;
      color: var(--accent);
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: .75rem;
    }
    h1 {
      font-size: clamp(1.7rem, 3vw, 2.1rem);
      font-weight: 700;
      letter-spacing: -.03em;
      line-height: 1.2;
      margin-bottom: .7rem;
    }
    h1 em { font-style: normal; color: var(--accent); }
    p { color: var(--muted); font-size: .98rem; margin-bottom: 1.5rem; }
    .actions { display: flex; gap: .6rem; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center;
      font-size: .88rem; font-weight: 550;
      padding: .55rem 1.15rem; border-radius: 999px;
    }
    .btn-pri { background: var(--accent); color: #fff; }
    .btn-pri:hover { background: #2563eb; }
    .btn-ghost { border: 1px solid var(--border); color: var(--text); }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
    footer { border-top: 1px solid var(--border); padding: 1.4rem 0; }
    .foot {
      width: min(1080px, 92%);
      margin: 0 auto;
      font-size: .82rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <nav>
      <div class="nav-inner">
        <a href="/website/" class="logo">Stark <span>/privacy</span></a>
        <a href="https://privtr.ee/@boringprivacy" class="nav-cta" target="_blank" rel="noopener">Academia</a>
      </div>
    </nav>
    <main>
      <div class="card">
        <div class="label">Error 404</div>
        <h1>Esta página<br><em>no está aquí</em></h1>
        <p>La ruta no existe o se ha movido. Vuelve al inicio o entra en la academia.</p>
        <div class="actions">
          <a class="btn btn-pri" href="/website/">Volver al inicio</a>
          <a class="btn btn-ghost" href="https://privtr.ee/@boringprivacy" target="_blank" rel="noopener">Academia</a>
        </div>
      </div>
    </main>
    <footer>
      <div class="foot">Stark Privacy · Sin privacidad tu libertad es solo una ilusión</div>
    </footer>
  </div>
</body>
</html>
